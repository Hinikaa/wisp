name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-dev

      - name: Run test suite
        run: make test

      - name: Build static-Lua release binary
        run: |
          make clean
          LUA_STATIC=$(find /usr/lib -name 'liblua5.4.a' | head -n 1)
          test -n "$LUA_STATIC"
          make wisp LUA_LIBS="$LUA_STATIC -lm -ldl"
          strip wisp
          ldd wisp
          ! ldd wisp | grep -i liblua

      - name: Smoke test
        run: |
          ./wisp --version
          ./wisp --help
          ./wisp -c 'files | count'

      - name: Package release asset
        run: |
          mkdir -p dist
          tar -czf "dist/wisp-linux-${{ matrix.arch }}.tar.gz" wisp README.md LICENSE LINENOISE_LICENSE example-init.lua

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-linux-${{ matrix.arch }}
          path: dist/wisp-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wisp-linux-*.tar.gz
          generate_release_notes: true
