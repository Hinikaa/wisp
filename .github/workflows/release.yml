name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            nfpm_arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            nfpm_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-dev

      - name: Run test suite
        run: make test

      - name: Build static-Lua release binary
        run: |
          make clean
          LUA_STATIC=$(find /usr/lib -name 'liblua5.4.a' | head -n 1)
          test -n "$LUA_STATIC"
          make wisp LUA_LIBS="$LUA_STATIC -lm -ldl"
          strip wisp
          ldd wisp
          ! ldd wisp | grep -i liblua

      - name: Smoke test
        run: |
          ./wisp --version
          ./wisp --help
          ./wisp -c 'files | count'
          ./wisp -c 'procs | count'

      - name: Package tarball, .deb, and .rpm
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          mkdir -p dist
          tar -czf "dist/wisp-linux-${{ matrix.arch }}.tar.gz" wisp README.md LICENSE LINENOISE_LICENSE example-init.lua

          export NFPM_VERSION="${GITHUB_REF_NAME#v}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          NFPM="$(go env GOPATH)/bin/nfpm"
          "$NFPM" package -f packaging/nfpm.yaml -p deb -t "dist/wisp_${NFPM_VERSION}_${{ matrix.nfpm_arch }}.deb"
          "$NFPM" package -f packaging/nfpm.yaml -p rpm -t "dist/wisp_${NFPM_VERSION}_${{ matrix.arch }}.rpm"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisp-linux-${{ matrix.arch }}
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: brew install lua@5.4 pkg-config

      - name: Run test suite
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/lua@5.4/lib/pkgconfig:/usr/local/opt/lua@5.4/lib/pkgconfig
        run: make test

      - name: Build static-Lua release binary
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/lua@5.4/lib/pkgconfig:/usr/local/opt/lua@5.4/lib/pkgconfig
        run: |
          make clean
          LUA_PREFIX=$(brew --prefix lua@5.4)
          LUA_STATIC=$(find "${LUA_PREFIX}/lib" -name 'liblua*.a' | head -n 1)
          test -n "$LUA_STATIC"
          make wisp LUA_CFLAGS="-I${LUA_PREFIX}/include/lua -I${LUA_PREFIX}/include" LUA_LIBS="$LUA_STATIC -lm"
          strip wisp
          otool -L wisp
          ! otool -L wisp | grep -i liblua

      - name: Smoke test
        run: |
          ./wisp --version
          ./wisp -c 'files | count'
          ./wisp -c 'procs | count'

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/wisp-macos-arm64.tar.gz" wisp README.md LICENSE LINENOISE_LICENSE example-init.lua

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisp-macos-arm64
          path: dist/*

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
